<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 | Code-First Agents</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <style>
      /* Self-hosted fonts (no third-party requests, GDPR-friendly). OFL 1.1. */
      @font-face {
        font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 700;
        font-display: swap; src: url("/assets/fonts/bricolage-grotesque-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 800;
        font-display: swap; src: url("/assets/fonts/bricolage-grotesque-800.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono"; font-style: normal; font-weight: 400;
        font-display: swap; src: url("/assets/fonts/jetbrains-mono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono"; font-style: normal; font-weight: 500;
        font-display: swap; src: url("/assets/fonts/jetbrains-mono-500.woff2") format("woff2");
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "JetBrains Mono", monospace;
        background: #0a0a0f;
        background-image: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 39px,
            rgba(180, 74, 255, 0.04) 39px,
            rgba(180, 74, 255, 0.04) 40px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 39px,
            rgba(180, 74, 255, 0.04) 39px,
            rgba(180, 74, 255, 0.04) 40px
          );
        color: #c8d6e5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .container {
        max-width: 480px;
        padding: 40px 24px;
      }
      .code {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 96px;
        color: #b44aff;
        text-shadow: 0 0 30px rgba(180, 74, 255, 0.5),
          0 0 60px rgba(180, 74, 255, 0.2);
        line-height: 1;
        margin-bottom: 16px;
      }
      .message {
        font-size: 14px;
        color: #4a5568;
        margin-bottom: 32px;
        line-height: 1.6;
      }
      .link {
        display: inline-block;
        font-size: 13px;
        color: #c084fc;
        text-decoration: none;
        padding: 8px 20px;
        border: 1px solid rgba(180, 74, 255, 0.3);
        border-radius: 6px;
        transition: border-color 0.3s, box-shadow 0.3s, color 0.3s;
      }
      .link:hover {
        color: #b44aff;
        border-color: #b44aff;
        box-shadow: 0 0 16px rgba(180, 74, 255, 0.5),
          0 0 4px rgba(180, 74, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <p class="message">
        This page doesn't exist. Maybe you followed a broken link, or the URL
        changed.
      </p>
      <a href="/" class="link">Back to Code-First Agents</a>
    </div>
  </body>
</html>
