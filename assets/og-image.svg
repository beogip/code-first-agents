<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(180,74,255,0.08)" stroke-width="1"/>
    </pattern>
    <!-- Radial glow for the dot -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b44aff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#b44aff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b44aff" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filter for title -->
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Dot glow (top-right) -->
  <circle cx="1050" cy="140" r="120" fill="url(#dotGlow)"/>
  <circle cx="1050" cy="140" r="28" fill="#b44aff"/>
  <circle cx="1050" cy="140" r="10" fill="#d78aff"/>

  <!-- Label (top-left, monospace) -->
  <text x="80" y="130" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="500" fill="#b44aff" letter-spacing="2">
    DESIGN PATTERNS FOR AI AGENTS
  </text>

  <!-- Title (main) -->
  <text x="80" y="260" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-size="110" font-weight="800" fill="#e0ddd5" letter-spacing="-3">
    Code-First
  </text>
  <text x="80" y="380" font-family="'Bricolage Grotesque', 'Arial Black', sans-serif" font-size="110" font-weight="800" fill="#b44aff" letter-spacing="-3" filter="url(#titleGlow)">
    Agents
  </text>

  <!-- Accent line under title -->
  <rect x="80" y="410" width="160" height="3" fill="#b44aff"/>

  <!-- Tagline -->
  <text x="80" y="470" font-family="Lora, Georgia, serif" font-size="32" fill="#c8d6e5" font-style="italic">
    Move deterministic work from the LLM to code.
  </text>
  <text x="80" y="515" font-family="Lora, Georgia, serif" font-size="28" fill="#706b68">
    The LLM orchestrates. Code executes.
  </text>

  <!-- URL (bottom) -->
  <text x="80" y="590" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" fill="#706b68">
    beogip.github.io/code-first-agents
  </text>
</svg>
